services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polichan-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - postgres
      - mongolo

  postgres:
    image: postgres:13
    container_name: polichan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongolo:
    image: mongo:latest
    container_name: polichan-mongolo
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - '${MONGODB_PORT}:27017'
    volumes:
      - mongodata:/data/db

volumes:
  pgdata:
  mongodata:
